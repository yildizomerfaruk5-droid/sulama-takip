# ============================================================
# Kong bildirimsel yapilandirmasi (veritabanisiz mod)
#
# Supabase'in resmi self-hosted kong.yml'inin sadelestirilmis hali.
# ${ANON_KEY} / ${SERVICE_ROLE_KEY} kur.sh tarafindan gercek
# degerlerle degistirilir (kong.uretilmis.yml).
# ============================================================
_format_version: "2.1"
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SERVICE_ROLE_KEY}

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  # ── Auth: yonetim uclari (YALNIZCA service_role) ──
  # Once tanimlanir ve yolu daha uzundur; Kong bunu
  # /auth/v1/ genel rotasindan ONCE eslestirir.
  - name: auth-v1-admin
    url: http://auth:9999/admin
    routes:
      - name: auth-v1-admin
        strip_path: true
        paths: [/auth/v1/admin]
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow: [admin]

  # ── Auth: acik uclar (giris, token yenileme, saglik) ──
  # strip_path yalnizca '/auth/v1' onekini kaldirir; geri kalan
  # yol (token, health, user, ...) GoTrue'ya oldugu gibi gider.
  - name: auth-v1-open
    url: http://auth:9999/
    routes:
      - name: auth-v1-open
        strip_path: true
        paths: [/auth/v1]
    plugins:
      - name: cors

  # ── REST API ──
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths: [/rest/v1/]
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow: [admin, anon]

  # ── Realtime (WebSocket) ──
  - name: realtime-v1-ws
    url: http://realtime:4000/socket
    protocol: http
    routes:
      - name: realtime-v1-ws
        strip_path: true
        paths: [/realtime/v1/]
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow: [admin, anon]

  # ── Storage (fotograflar) ──
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths: [/storage/v1/]
    plugins:
      - name: cors
