# ============================================================
# Tek giris noktasi: uygulama + Supabase API'si ayni port/origin
#
# Uygulama VITE_SUPABASE_URL olarak kendi adresini kullanir
# (orn. http://sulama.local). supabase-js /rest/v1, /auth/v1,
# /realtime/v1, /storage/v1 yollarini ekler; hepsi Kong'a gider.
# ============================================================

upstream supabase_kong {
    server kong:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;   # saha fotograflari

    # ── Supabase API'si ──
    location ~ ^/(rest|auth|storage|functions)/ {
        proxy_pass http://supabase_kong;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Realtime (WebSocket) ──
    location /realtime/ {
        proxy_pass http://supabase_kong;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;   # uzun omurlu baglanti
        proxy_send_timeout 3600s;
    }

    # ── Uygulama (PWA) ──
    root /usr/share/nginx/html;
    index index.html;

    # Vite dosya adlarini hash'ler: uzun omurlu onbellek guvenli
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker ve manifest ASLA onbelleklenmemeli;
    # yoksa guncelleme sonrasi eski surum yapisir.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Tek sayfalik uygulama: bilinmeyen yollar index.html'e duser
    location / {
        try_files $uri $uri/ /index.html;
    }
}
